name: docbridge-api

on:
  push:
    branches: [main]
    paths:
      - "services/docbridge-api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service-docbridge-api.yml"
      - ".github/workflows/_service.yml"
  pull_request:
    paths:
      - "services/docbridge-api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service-docbridge-api.yml"
      - ".github/workflows/_service.yml"

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: docbridge-api
