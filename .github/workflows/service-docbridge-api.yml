name: docbridge-api

on:
  push:
    branches: [main]
    paths:
      - "services/docbridge-api/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/service-docbridge-api.yml"
      - ".github/workflows/_service.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "services/docbridge-api/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/service-docbridge-api.yml"
      - ".github/workflows/_service.yml"

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: docbridge-api
