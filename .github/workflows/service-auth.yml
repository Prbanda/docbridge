name: auth

on:
  push:
    branches: [main]
    paths:
      - "services/auth/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/service-auth.yml"
      - ".github/workflows/_service.yml"
  pull_request:
    paths:
      - "services/auth/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/service-auth.yml"
      - ".github/workflows/_service.yml"

permissions:
  id-token: write
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_service.yml
    with:
      service: auth
