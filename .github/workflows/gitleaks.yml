# No credentials, API keys, or secrets in source code — enforced in CI
# (requirements: Security; TDD Security & access).
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # gitleaks CLI directly: gitleaks-action requires a paid license for
      # organization-owned repos; the CLI is free and scans the same rules.
      - name: Run gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
