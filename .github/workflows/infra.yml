name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write # plan output as PR comment

env:
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive infra/
      - name: Validate all environments
        run: |
          for env in global dev prod; do
            (cd "infra/envs/$env" && terraform init -backend=false -input=false && terraform validate)
          done

  plan:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Terraform creates Lambda functions from these packages (infra/modules/lambda).
      - name: Package Lambdas
        run: ./scripts/build-lambdas.sh
      - name: Diagnose GitHub context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
        run: |
          echo "Repository: $GH_REPOSITORY"
          echo "Event: $GH_EVENT"
          echo "Ref: $GH_REF"
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan dev
        id: plan
        working-directory: infra/envs/dev
        run: |
          set -o pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=docbridge/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/envs/dev/plan.txt', 'utf8');
            const body = `### Terraform plan (dev)\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\``;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  apply-dev:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Terraform creates Lambda functions from these packages (infra/modules/lambda).
      - name: Package Lambdas
        run: ./scripts/build-lambdas.sh
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Apply global (ECR)
        working-directory: infra/envs/global
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=docbridge/global/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # ECS services can't start without an image to pull: on a fresh environment the first create fails with
      # "No rollback candidate". Push :dev for any service whose repo lacks it; later builds come from _service.yml.
      - name: Seed service images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for svc in auth platform docbridge-api; do
            if aws ecr describe-images --repository-name "docbridge/$svc" --image-ids imageTag=dev >/dev/null 2>&1; then
              echo "docbridge/$svc:dev exists"
              continue
            fi
            REPO="$REGISTRY/docbridge/$svc"
            docker build -f "services/$svc/Dockerfile" -t "$REPO:${{ github.sha }}" -t "$REPO:dev" .
            docker push "$REPO:${{ github.sha }}"
            docker push "$REPO:dev"
          done
      - name: Apply dev
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=docbridge/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve

  apply-prod:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: apply-dev
    runs-on: ubuntu-latest
    # Requires manual approval: configure the 'prod' environment with a
    # required reviewer in GitHub settings (launch plan approval gate).
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      # Terraform creates Lambda functions from these packages (infra/modules/lambda).
      - name: Package Lambdas
        run: ./scripts/build-lambdas.sh
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Prod runs :prod. Promote the image dev is running for any service whose repo lacks it.
      - name: Seed service images
        run: |
          for svc in auth platform docbridge-api; do
            if aws ecr describe-images --repository-name "docbridge/$svc" --image-ids imageTag=prod >/dev/null 2>&1; then
              echo "docbridge/$svc:prod exists"
              continue
            fi
            MANIFEST=$(aws ecr batch-get-image --repository-name "docbridge/$svc" --image-ids imageTag=dev \
              --query 'images[0].imageManifest' --output text)
            aws ecr put-image --repository-name "docbridge/$svc" --image-tag prod --image-manifest "$MANIFEST" >/dev/null
          done
      - name: Apply prod
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=docbridge/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve
