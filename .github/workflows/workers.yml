# Lambda workers (ADR-011): build + test → package → update-function-code (TDD 0.3).
name: workers

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "tools/db-bootstrap/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "scripts/build-lambdas.sh"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "workers/**"
      - "tools/db-bootstrap/**"
      - "packages/shared/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "scripts/build-lambdas.sh"
      - ".github/workflows/workers.yml"

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build DocBridge.slnx -c Release
      - run: dotnet test --project tests/DocBridge.UnitTests -c Release --no-build
      - name: Package Lambdas
        run: ./scripts/build-lambdas.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: dist/lambda/*.zip

  deploy-dev:
    if: github.ref == 'refs/heads/main' && vars.LAMBDA_DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: dist/lambda
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Update function code
        run: |
          deploy() { # package, functions...
            local pkg="$1"; shift
            for fn in "$@"; do
              aws lambda update-function-code --function-name "docbridge-dev-$fn" --zip-file "fileb://dist/lambda/$pkg.zip" >/dev/null
              aws lambda wait function-updated-v2 --function-name "docbridge-dev-$fn"
              echo "updated docbridge-dev-$fn"
            done
          }
          deploy fanout fanout
          deploy delivery delivery
          deploy ws ws-connect ws-subscribe ws-disconnect
          deploy maintenance task-dlq job-dlq sweeper
          deploy db-bootstrap db-bootstrap
