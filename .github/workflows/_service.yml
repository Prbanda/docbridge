# Reusable pipeline for one ECS service: lint → test → image → ECR → deploy (TDD 0.3).
# Called by the thin per-service workflows, which own the path filters.
name: service-pipeline

on:
  workflow_call:
    inputs:
      service:
        description: "Service directory under services/ (also the ECR repo suffix and ECS service name)"
        required: true
        type: string

permissions:
  id-token: write # OIDC to AWS: no long-lived keys in GitHub
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore DocBridge.slnx
      # Warnings are errors (Directory.Build.props): the build is the type check and the analyzer lint.
      - run: dotnet build DocBridge.slnx -c Release --no-restore
      - run: dotnet format DocBridge.slnx --verify-no-changes --no-restore
      - run: dotnet test --project tests/DocBridge.UnitTests -c Release --no-build

  build-push:
    # Images are pushed only from main; PRs stop at checks.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (git SHA + dev tag)
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/docbridge/${{ inputs.service }}"
          docker build -f services/${{ inputs.service }}/Dockerfile -t "$REPO:${{ github.sha }}" -t "$REPO:dev" .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:dev"

  deploy-dev:
    # The ECS task definition runs the mutable :dev tag, so a forced deployment picks up the new image.
    # Rollback = re-tag the previous SHA as :dev and run this job again.
    if: github.ref == 'refs/heads/main' && vars.ECS_DEPLOY_ENABLED == 'true'
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Roll the ECS service
        run: |
          aws ecs update-service --cluster docbridge-dev --service ${{ inputs.service }} --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster docbridge-dev --services ${{ inputs.service }}
