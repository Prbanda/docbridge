# Local stand-in for both AWS routing layers (ADR-001):
#   - the public edge (API Gateway HTTP API + WebSocket API + CloudFront) for the browser and tests, and
#   - the internal ALB that the API and workers use to reach auth and the platform.
# Path routing matches the ALB listener rules. Every service validates JWTs itself (defense in depth), so routes
# behave the same; in AWS the gateway also rejects unauthenticated calls first. Like the ALB, a stopped upstream
# answers 502 at once, which is what the delivery worker's retry path expects.
server {
  listen 8080;
  client_max_body_size 2m;   # browser file bytes never flow through here (ADR-002)

  resolver 127.0.0.11 valid=10s;
  resolver_timeout 2s;   # a stopped upstream must fail fast (502), as the ALB does
  set $auth http://auth:3001;
  set $platform http://platform:3002;
  set $api http://docbridge-api:3003;
  set $ws http://workers-local:3005;

  location ~ ^/(auth/|\.well-known/)            { proxy_pass $auth; }
  location ~ ^/(destinations|files|jobs)(/|$)   { proxy_pass $api; }
  location ~ ^/(teams|binders|users|admin|search)(/|$) { proxy_pass $platform; }

  # Worker → platform ingest (service token): up to 1 GB, streamed, not buffered (ALB idle timeout 300 s).
  location ~ ^/documents(/|$) {
    proxy_pass $platform;
    client_max_body_size 1100m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location = /ws {
    proxy_pass $ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 2h;
  }

  location = /config.js {
    default_type application/javascript;
    return 200 'window.DOCBRIDGE_CONFIG = { apiBaseUrl: "", wsUrl: "ws://localhost:8080/ws" };';
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
